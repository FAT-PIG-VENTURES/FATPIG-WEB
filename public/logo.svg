<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Head (Muted Indigo) -->
  <circle cx="50" cy="50" r="45" fill="#4F65F1" />
  
  <!-- Left Eye (Background Color to act as cutout) -->
  <circle cx="35" cy="40" r="6" fill="#050505" />
  
  <!-- Right Eye -->
  <circle cx="65" cy="40" r="6" fill="#050505" />
  
  <!-- Snout (Steel Blue / Light Accent) -->
  <ellipse cx="50" cy="55" rx="15" ry="10" fill="#8EA0FE" />
  
  <!-- Left Nostril -->
  <circle cx="45" cy="55" r="2.5" fill="#050505" />
  
  <!-- Right Nostril -->
  <circle cx="55" cy="55" r="2.5" fill="#050505" />
</svg>
